# nginx proxy address - http://172.17.0.1:8103

name: caddy
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: caddy:latest
    pull_policy: always
    container_name: caddy-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - caddy
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8103:80"
      - "172.17.0.1:8104:443"
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: caddy-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/config/caddy:/config
      - ./volumes/data/caddy:/data
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://caddy-app:80'
      - 'cloudflare.hostname=caddy.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.caddy-app.entrypoints=http'
      - 'traefik.http.routers.caddy-app-secure.tls=true'
      - 'traefik.http.routers.caddy-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.caddy-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.caddy-app.middlewares=caddy-app-https-redirect'
      - 'traefik.http.routers.caddy-app-secure.entrypoints=https'
      - 'traefik.http.routers.caddy-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.caddy-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.caddy-app-secure.service=caddy-app'
      - 'traefik.http.services.caddy-app.loadbalancer.server.port=80'

networks:
  caddy:
    name: caddy
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
